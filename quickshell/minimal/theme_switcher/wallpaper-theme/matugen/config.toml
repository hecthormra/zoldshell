# matugen config that renders ONLY the quickshell wallpaper theme.
# Used via `matugen image <img> -c this-file`, so it never touches your own
# matugen setup.
[config]

[templates.quickshell]
input_path = "/home/hecthor/.config/quickshell/minimal/theme_switcher/wallpaper-theme/matugen/template.json"
output_path = "/home/hecthor/.config/quickshell/theme-switcher/wallpaper-theme.json"
